<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手帳記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 莫蘭迪色系調色盤 */
  --paper: #F3F1EC;       
  --paper2: #EBE7E0;      
  --paper3: #DFDCD4;      
  
  --ink: #5C5A55;         
  --ink2: #7A7873;        
  --ink3: #9C9A94;        
  --ink4: #BDBBB5;        
  
  --accent: #78898B;      
  --accent2: #92A3A5;     
  --accent3: #D0D6D6;     
  
  --income: #8B9B82;      
  --income-bg: #E3E7E1;
  --expense: #B88B8D;     
  --expense-bg: #EBE0E1;
  
  --border: #D8D5CD;
  --border2: #C4C1B9;
  
  --r: 12px;              
  --r2: 18px;
  --shadow: 0 6px 16px rgba(92, 90, 85, 0.06);
}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100dvh;
  font-size:14px;
  line-height:1.7;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(160,150,140,.06) 27px,rgba(160,150,140,.06) 28px);
}

/* ─── Layout ─── */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100dvh;max-width:1100px;margin:0 auto}
@media(max-width:768px){.app{grid-template-columns:1fr}}

/* ─── Sidebar ─── */
.sidebar{
  background:var(--paper2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow-y:auto;
}
@media(max-width:768px){
  .sidebar{height:auto;position:static;border-right:none;border-bottom:2px solid var(--border2);flex-direction:row;overflow-x:auto;padding:0}
  .sidebar::-webkit-scrollbar { display: none; }
}

.logo{
  padding:1.75rem 1.25rem 1.5rem;
  border-bottom:1px dashed var(--border);
  display:flex;align-items:center;gap:12px;
}
.logo-icon{
  width:40px;height:40px;
  background:var(--accent);
  color:var(--paper);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  flex-shrink:0;
  box-shadow: 0 4px 10px rgba(120, 137, 139, 0.3);
}
.logo-name{
  font-family:'Noto Serif TC',serif;
  font-size:19px;
  font-weight:700;
  color:var(--ink);
  letter-spacing:1px;
}
@media(max-width:768px){.logo{padding:.75rem 1rem;border-bottom:none;border-right:1px solid var(--border)}}

.nav{padding:1rem .75rem;flex:1}
@media(max-width:768px){.nav{display:flex;padding:.4rem .5rem;gap:2px;flex-shrink:0}}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:.65rem .85rem;
  margin-bottom:4px;
  border-radius:var(--r);
  cursor:pointer;font-size:14px;color:var(--ink2);font-weight:500;
  transition:all .2s ease;white-space:nowrap;
  letter-spacing:.3px;
}
.nav-item:hover{background:var(--paper3);color:var(--ink)}
.nav-item.active{background:var(--accent);color:var(--paper);box-shadow: 0 2px 6px rgba(120, 137, 139, 0.2);}
.nav-icon{font-size:16px;flex-shrink:0}

.month-nav{
  padding:1.25rem;
  border-top:1px dashed var(--border);
  margin-top:auto;
}
@media(max-width:768px){
  .month-nav{display:flex;align-items:center;gap:8px;padding:.5rem .75rem;border-top:none;border-left:1px solid var(--border);margin-top:0;margin-left:auto;flex-shrink:0}
}
.month-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;letter-spacing:1px}
@media(max-width:768px){.month-title{margin-bottom:0}}
.month-btns{display:flex;gap:8px;align-items:center}
.mb{
  background:var(--paper);border:1px solid var(--border);
  border-radius:8px;width:32px;height:32px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:14px;transition:all .15s;
}
.mb:hover{background:var(--accent3);border-color:var(--border2);color:var(--ink)}
.ml{font-size:14px;font-weight:700;color:var(--ink);min-width:44px;text-align:center;font-family:'Noto Serif TC',serif;letter-spacing:1px}

/* ─── Sync bar ─── */
.sync-bar{
  padding:.6rem 1rem;
  background:var(--paper3);
  border-bottom:1px dashed var(--border);
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--ink2);
  border-radius: var(--r) var(--r) 0 0;
  margin: 1.5rem 1.75rem 0;
}
@media(max-width:768px){.sync-bar{margin: 0; border-radius: 0;}}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink4);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--income)}
.sync-dot.err{background:var(--expense)}
.sync-dot.loading{background:var(--accent2);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── Main ─── */
.main{overflow-y:auto;padding:0 1.75rem 1.5rem}
@media(max-width:768px){.main{padding:.75rem 1rem}}

/* ─── Page ─── */
.page{display:none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);}
.page.active{display:block; margin-top: 1rem;}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ─── Cards ─── */
.card{
  background:var(--paper2);
  border:1px solid var(--border);
  border-radius:var(--r2);
  padding:1.5rem 1.75rem;
  box-shadow:var(--shadow);
  position:relative;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:var(--r2) var(--r2) 0 0;
  opacity:.7;
}
.card+.card{margin-top:1.25rem}
.card-title{
  font-family:'Noto Serif TC',serif;
  font-size:17px;font-weight:700;color:var(--accent);
  letter-spacing:1px;margin-bottom:1.25rem;
}

/* ─── Summary ─── */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
@media(max-width:480px){.summary-grid{grid-template-columns:1fr 1fr}}
.stat{
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:1rem 1.25rem;
  text-align:center;
  position:relative;overflow:hidden;
  box-shadow: 0 2px 8px rgba(92, 90, 85, 0.03);
}
.stat::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
}
.stat.inc::after{background:var(--income)}
.stat.exp::after{background:var(--expense)}
.stat.bal::after{background:var(--accent2)}
.stat-label{font-size:11px;color:var(--ink3);margin-bottom:6px;letter-spacing:1.5px;font-weight:500}
.stat-value{font-family:'Quicksand',sans-serif;font-size:22px;font-weight:700}
.stat-value.inc{color:var(--income)}.stat-value.exp{color:var(--expense)}.stat-value.bal{color:var(--accent)}
@media(max-width:480px){.stat:last-child{grid-column:1/-1}}

/* ─── Bar chart ─── */
.bar-chart{overflow-x:auto;padding-bottom:.5rem;margin:.5rem 0}
.bars-wrap{display:flex;align-items:flex-end;gap:6px;height:100px;min-width:min-content}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:28px}
.bar-track{display:flex;align-items:flex-end;gap:2px;height:76px;justify-content:center;width:100%}
.bar{border-radius:4px 4px 0 0;min-height:3px;width:11px; transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);}
.bar.e{background:var(--expense)}.bar.i{background:var(--income)}
.bar-d{font-size:10px;color:var(--ink3);font-family:'Quicksand',sans-serif;font-weight:600}
.bar-legend{display:flex;gap:16px;margin-top:.75rem;font-size:12px;color:var(--ink2);font-weight:500;}
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}

/* ─── Transactions ─── */
.tx-date-group{margin-bottom:.5rem}
.tx-date-header{
  font-family:'Noto Serif TC',serif;
  font-size:14px;font-weight:700;color:var(--ink3);
  padding:.5rem 0 .25rem;
  border-bottom:1px dashed var(--border);
  margin-bottom:.5rem;
  letter-spacing:1px;
}
.tx-item{
  display:flex;align-items:center;gap:12px;
  padding:.6rem .5rem;
  border-bottom:1px solid rgba(216, 213, 205, 0.5);
  transition:background .2s;
  border-radius:var(--r);
}
.tx-item:last-child{border-bottom:none}
.tx-item:hover{background:var(--paper3)}
.tx-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.tx-icon.income{background:var(--income-bg);color:var(--income)}
.tx-icon.expense{background:var(--expense-bg);color:var(--expense)}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--ink3);margin-top:2px}
.tx-amt{font-family:'Quicksand',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.tx-amt.income{color:var(--income)}.tx-amt.expense{color:var(--expense)}
.tx-del{
  width:28px;height:28px;border:none;background:none;cursor:pointer;
  border-radius:8px;color:var(--ink4);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;opacity:0;transition:all .2s;
}
.tx-item:hover .tx-del{opacity:1}
.tx-del:hover{background:var(--expense-bg);color:var(--expense)}
.tag{
  display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:500;
  background:var(--accent3);color:var(--ink);
}
.empty{
  text-align:center;padding:3.5rem 1rem;
  color:var(--ink4);font-size:14px;
  font-family:'Noto Serif TC',serif;letter-spacing:1px;
  line-height:2;
}

/* ─── Form ─── */
.form-add{display:grid;gap:1rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{
  font-weight:500;color:var(--ink2);
  letter-spacing:.5px;font-size:12px;
}
.fg input,.fg select{
  padding:10px 12px;font-size:14px;
  font-family:'Noto Sans TC',sans-serif;
  border:1px solid var(--border);border-radius:var(--r);
  background:var(--paper);color:var(--ink);outline:none;width:100%;
  transition:all .2s;
}
.fg input:focus,.fg select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(120, 137, 139, 0.15);
  background:#fff;
}
.type-toggle{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  background:var(--paper3);padding:4px;border-radius:var(--r);
  border:1px solid var(--border);
}
.tt-btn{
  border:none;border-radius:8px;padding:10px;
  font-size:14px;font-family:'Noto Sans TC',sans-serif;
  cursor:pointer;font-weight:500;background:transparent;color:var(--ink2);
  transition:all .2s;letter-spacing:.5px;
}
.tt-btn.active.exp{background:var(--expense-bg);color:var(--expense);border:1px solid rgba(184, 139, 141, 0.3);box-shadow:0 2px 4px rgba(184, 139, 141, 0.1)}
.tt-btn.active.inc{background:var(--income-bg);color:var(--income);border:1px solid rgba(139, 155, 130, 0.3);box-shadow:0 2px 4px rgba(139, 155, 130, 0.1)}
.btn-primary{
  width:100%;padding:12px;font-size:15px;
  font-family:'Noto Serif TC',serif;font-weight:700;letter-spacing:2px;
  border:none;border-radius:var(--r);
  background:var(--accent);color:var(--paper);cursor:pointer;
  transition:all .2s;box-shadow: 0 4px 10px rgba(120, 137, 139, 0.2);
}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow: 0 6px 14px rgba(120, 137, 139, 0.3);}
.btn-primary:active{transform:scale(.98);box-shadow:none;}

/* ─── Pie ─── */
.pie-wrap{display:grid;grid-template-columns:160px 1fr;gap:1.5rem;align-items:center}
@media(max-width:480px){.pie-wrap{grid-template-columns:1fr;justify-items:center}}
.pie-legend{display:flex;flex-direction:column;gap:.6rem}
.pie-leg-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.pie-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.pie-leg-name{flex:1;}
.pie-leg-pct{font-family:'Quicksand',sans-serif;font-weight:600;font-size:12px;color:var(--ink3)}

/* ─── Budget ─── */
.budget-grid{display:grid;gap:.8rem}
.budget-row{display:grid;grid-template-columns:80px 1fr auto 56px;gap:10px;align-items:center}
@media(max-width:480px){.budget-row{grid-template-columns:70px 1fr 50px}}
.budget-cat{font-size:13px;font-weight:500;color:var(--ink)}
.progress-track{height:8px;background:var(--paper3);border-radius:4px;overflow:hidden}
.progress-bar{height:100%;border-radius:4px;transition:width .5s cubic-bezier(0.16, 1, 0.3, 1);}
.budget-pct{font-family:'Quicksand',sans-serif;font-weight:600;font-size:12px;color:var(--ink3);text-align:right}
.budget-input-row{display:grid;grid-template-columns:1fr 1fr auto;gap:1rem;align-items:end;margin-top:1rem}
@media(max-width:480px){.budget-input-row{grid-template-columns:1fr auto}}
.btn-sm{
  padding:10px 16px;font-size:13px;
  font-family:'Noto Serif TC',serif;font-weight:700;letter-spacing:1px;
  border:1px solid var(--border2);border-radius:var(--r);
  background:var(--paper);color:var(--ink);cursor:pointer;
  transition:all .2s;
}
.btn-sm:hover{background:var(--paper3);border-color:var(--accent)}

/* ─── Toast ─── */
.toast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);
  padding:.75rem 1.5rem;border-radius:20px;
  font-size:13px;font-weight:500;opacity:0;transition:opacity .3s,transform .3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events:none;z-index:999;white-space:nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── Decorative ─── */
.page-header{
  display:flex;align-items:baseline;gap:12px;margin-bottom:1.25rem;
}
.page-header h1{
  font-family:'Noto Serif TC',serif;
  font-size:24px;font-weight:700;color:var(--accent);letter-spacing:2px;
}
.page-header .subtitle{font-size:12px;color:var(--ink4);letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<div class="app">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">📖</div>
    <span class="logo-name">日常手帖</span>
  </div>
  <nav class="nav">
    <div class="nav-item active" onclick="gotoPage('dashboard',this)">
      <span class="nav-icon">🏡</span>本月總覽
    </div>
    <div class="nav-item" onclick="gotoPage('add',this)">
      <span class="nav-icon">✏️</span>新增記錄
    </div>
    <div class="nav-item" onclick="gotoPage('chart',this)">
      <span class="nav-icon">🥧</span>收支圖表
    </div>
    <div class="nav-item" onclick="gotoPage('budget',this)">
      <span class="nav-icon">🎯</span>預算設定
    </div>
    <!-- 匯出資料按鈕 -->
    <div class="nav-item" onclick="exportCSV()">
      <span class="nav-icon">📥</span>匯出資料
    </div>
  </nav>
  <div class="month-nav">
    <div class="month-title" id="sideMonthLabel">月份</div>
    <div class="month-btns">
      <button class="mb" onclick="changeMonth(-1)">‹</button>
      <span class="ml" id="sideMonthShort"></span>
      <button class="mb" onclick="changeMonth(1)">›</button>
    </div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <div class="sync-bar">
    <div class="sync-dot loading" id="syncDot"></div>
    <span id="syncStatus">雲端連線中...</span>
  </div>

  <!-- Dashboard -->
  <div class="page active" id="page-dashboard">
    <div class="page-header">
      <h1 id="dashTitle">本月記帳</h1>
      <span class="subtitle">OVERVIEW</span>
    </div>
    <div class="summary-grid">
      <div class="stat inc"><div class="stat-label">收 入</div><div class="stat-value inc" id="dIncome">NT$0</div></div>
      <div class="stat exp"><div class="stat-label">支 出</div><div class="stat-value exp" id="dExpense">NT$0</div></div>
      <div class="stat bal"><div class="stat-label">結 餘</div><div class="stat-value bal" id="dBalance">NT$0</div></div>
    </div>
    <div class="card">
      <div class="card-title">每日收支</div>
      <div class="bar-chart"><div class="bars-wrap" id="barChart"></div></div>
      <div class="bar-legend">
        <span><span class="ldot" style="background:var(--expense)"></span>支出</span>
        <span><span class="ldot" style="background:var(--income)"></span>收入</span>
      </div>
    </div>
    <div class="card" style="margin-top:1.5rem">
      <div class="card-title">近期明細</div>
      <div id="txList"><div class="empty">📝<br>本月尚無記錄<br>點左側「新增記錄」開始記帳</div></div>
    </div>
  </div>

  <!-- Add -->
  <div class="page" id="page-add">
    <div class="page-header">
      <h1>新增記錄</h1>
      <span class="subtitle">NEW ENTRY</span>
    </div>
    <div class="card">
      <div class="form-add">
        <div class="type-toggle">
          <button class="tt-btn active exp" id="btnExp" onclick="setType('expense')">💸 支出</button>
          <button class="tt-btn" id="btnInc" onclick="setType('income')">💰 收入</button>
        </div>
        <div class="form-row">
          <div class="fg">
            <label>項目名稱</label>
            <input type="text" id="txName" placeholder="例：午餐、薪資">
          </div>
          <div class="fg">
            <label>金額（NT$）</label>
            <input type="number" id="txAmt" placeholder="0" min="0" step="1">
          </div>
        </div>
        <div class="form-row">
          <div class="fg">
            <label>分類</label>
            <select id="txCat"></select>
          </div>
          <div class="fg">
            <label>日期</label>
            <input type="date" id="txDate">
          </div>
        </div>
        <div class="fg">
          <label>備註（選填）</label>
          <input type="text" id="txNote" placeholder="備註說明">
        </div>
        <button class="btn-primary" onclick="addTx()">記 錄 下 來</button>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div class="page" id="page-chart">
    <div class="page-header">
      <h1>收支圖表</h1>
      <span class="subtitle">CHARTS</span>
    </div>
    <div class="card">
      <div class="card-title">支出分類佔比</div>
      <div class="pie-wrap">
        <canvas id="pieCanvas" width="160" height="160"></canvas>
        <div class="pie-legend" id="pieLegend"></div>
      </div>
    </div>
    <div class="card" style="margin-top:1.5rem">
      <div class="card-title">收入分類佔比</div>
      <div class="pie-wrap">
        <canvas id="pieIncCanvas" width="160" height="160"></canvas>
        <div class="pie-legend" id="pieLegendInc"></div>
      </div>
    </div>
  </div>

  <!-- Budget -->
  <div class="page" id="page-budget">
    <div class="page-header">
      <h1>預算設定</h1>
      <span class="subtitle">BUDGET</span>
    </div>
    <div class="card">
      <div class="card-title">本月預算進度</div>
      <div class="budget-grid" id="budgetGrid"></div>
    </div>
    <div class="card" style="margin-top:1.5rem">
      <div class="card-title">設定分類預算</div>
      <div class="budget-input-row">
        <div class="fg">
          <label>分類</label>
          <select id="budgetCat"></select>
        </div>
        <div class="fg">
          <label>預算金額（NT$）</label>
          <input type="number" id="budgetAmt" placeholder="0" min="0">
        </div>
        <button class="btn-sm" onclick="saveBudget()">儲存</button>
      </div>
    </div>
  </div>

</main>
</div>

<div class="toast" id="toast"></div>

<!-- 載入 Firebase 官方 SDK (使用 CDN 網址) -->
<script type="module">
// 從 CDN 引入模組，這是在瀏覽器直接跑 HTML 必須的作法
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
// 改為引入 Realtime Database 模組
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

// --- 你的 Firebase 設定 ---
const firebaseConfig = {
  apiKey: "AIzaSyAcz6x6OZ0zFe24lvDsCLslO3dgCuUQGFE",
  authDomain: "money-8f158.firebaseapp.com",
  databaseURL: "https://money-8f158-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "money-8f158",
  storageBucket: "money-8f158.firebasestorage.app",
  messagingSenderId: "440960174909",
  appId: "1:440960174909:web:a819ba7513a498e90e1354",
  measurementId: "G-4NTEPXYXLS"
};

// 初始化 Firebase 與各項服務
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app); // 啟動 Google Analytics
const db = getDatabase(app); // 使用 Realtime Database
const auth = getAuth(app);

// 設定 Realtime Database 路徑參考 (使用 ref) - 已大幅簡化
const familyDbRef = ref(db, 'family_ledger');

// --- 基礎設定 ---
const CATS_EXP=['餐飲','交通','購物','娛樂','醫療','住宿','教育','其他'];
const CATS_INC=['薪資','獎金','副業','投資','其他'];
const CAT_ICON={餐飲:'🍜',交通:'🚌',購物:'🛍',娛樂:'🎮',醫療:'💊',住宿:'🏠',教育:'📚',薪資:'💼',獎金:'🎁',副業:'💻',投資:'📈',其他:'📁'};

const PIE_COLORS=['#78898B','#B88B8D','#8B9B82','#A18D95','#C9B6A1','#8E9EAB','#B5A69B','#95A5A6','#C2A3A3','#A3B2A1'];

let txs = JSON.parse(localStorage.getItem('my_txs') || '[]');
let budgets = JSON.parse(localStorage.getItem('my_budgets') || '{}');
let isFirebaseReady = false;

let currentType = 'expense';
let curY = new Date().getFullYear();
let curM = new Date().getMonth();

const fmt = n => 'NT$' + Math.round(Math.abs(n)).toLocaleString();
function monthTxs(y, m) { return txs.filter(t => { const d = new Date(t.date); return d.getFullYear() === (y ?? curY) && d.getMonth() === (m ?? curM) }) }

function saveLocal() { 
  localStorage.setItem('my_txs', JSON.stringify(txs)); 
  localStorage.setItem('my_budgets', JSON.stringify(budgets)); 
}

function toast(msg) { 
  const t = document.getElementById('toast'); 
  t.textContent = msg; 
  t.classList.add('show'); 
  setTimeout(() => t.classList.remove('show'), 2500); 
}

function setSyncStatus(state, msg) {
  const dot = document.getElementById('syncDot');
  const status = document.getElementById('syncStatus');
  if(dot) dot.className = 'sync-dot ' + (state || 'ok');
  if(status) status.textContent = msg;
}

// ── 啟動 Firebase 認證與即時監聽 (Realtime Database 版) ──
function setupRealtimeSync() {
  isFirebaseReady = true;
  // 設定即時監聽：使用 onValue
  onValue(familyDbRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      txs = data.txs || [];
      budgets = data.budgets || {};
      saveLocal(); 
      renderAll();
      setSyncStatus('ok', '雲端即時同步中 ✨');
    } else {
      // 如果是全新的一本帳本，幫它初始化
      set(familyDbRef, { txs: txs, budgets: budgets }).catch(e => console.error(e));
    }
  }, (error) => {
    console.error("Database 監聽失敗 (可能是權限規則沒開):", error);
    setSyncStatus('err', '權限錯誤，請檢查 Firebase 後台 Rules');
    toast("⚠️ 無法寫入雲端，請確認已修改 Firebase 權限！");
  });
}

async function initFirebase() {
  try {
    await signInAnonymously(auth);
  } catch (error) {
    console.error("Firebase 登入失敗:", error);
    if (error.code === 'auth/configuration-not-found' || error.code === 'auth/admin-restricted-operation') {
      console.warn("您尚未在 Firebase 開啟「匿名登入」，已自動切換為無驗證直接連線...");
      setupRealtimeSync(); // 降級為免驗證直接連線
    } else {
      setSyncStatus('err', '網路異常，目前為本地單機模式');
    }
  }
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    setupRealtimeSync();
  }
});

async function pushToCloud() {
  if (!isFirebaseReady) return;
  setSyncStatus('loading', '資料上傳中...');
  try {
    // 使用 set 來覆蓋/寫入資料
    await set(familyDbRef, { txs, budgets });
    setSyncStatus('ok', '雲端即時同步中 ✨');
  } catch(e) {
    console.error("寫入 Database 失敗:", e);
    setSyncStatus('err', '連線不穩，已暫存本地');
    toast("⚠️ 上傳失敗，請確認已修改 Firebase 權限！");
  }
}

// ── 匯出 CSV 功能 ──
window.exportCSV = function() {
  if (!txs || txs.length === 0) {
    toast('⚠️ 目前沒有任何記錄可匯出');
    return;
  }

  // 定義 CSV 標頭
  const headers = ['日期', '類型', '分類', '項目名稱', '金額', '備註'];
  
  // 依日期排序，新的在上面
  const sortedTxs = [...txs].sort((a, b) => b.date.localeCompare(a.date));

  // 將資料轉化為 CSV 行格式，並妥善處理文字中的引號與逗號
  const rows = sortedTxs.map(t => {
    const typeStr = t.type === 'expense' ? '支出' : '收入';
    // 把文字中的雙引號轉換為兩個雙引號 (CSV 標準格式)，然後用雙引號把整個字串包起來
    const escapeCSV = (str) => `"${(str || '').toString().replace(/"/g, '""')}"`;
    
    return [
      escapeCSV(t.date),
      escapeCSV(typeStr),
      escapeCSV(t.cat),
      escapeCSV(t.name),
      t.amount,
      escapeCSV(t.note)
    ].join(',');
  });

  // 結合標頭與內容
  const csvContent = headers.join(',') + '\n' + rows.join('\n');

  // 加上 BOM ( \uFEFF )，這樣用 Excel 打開 CSV 才不會出現中文亂碼
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  
  // 建立隱藏的下載連結並觸發點擊
  const link = document.createElement('a');
  const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
  link.setAttribute('href', url);
  link.setAttribute('download', `日常手帖紀錄_${dateStr}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  
  toast('✅ 成功匯出 CSV！');
}

// ── Navigation ──
window.gotoPage = function(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(el) el.classList.add('active');
  renderAll();
}

window.changeMonth = function(d) {
  curM += d;
  if(curM < 0) { curM = 11; curY--; }
  if(curM > 11) { curM = 0; curY++; }
  renderAll();
}
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function updateMonthLabel() {
  document.getElementById('sideMonthLabel').textContent = curY + '年';
  document.getElementById('sideMonthShort').textContent = MONTHS[curM];
  document.getElementById('dashTitle').textContent = curY + '年' + MONTHS[curM];
}

window.setType = function(t) {
  currentType = t;
  document.getElementById('btnExp').className = 'tt-btn' + (t === 'expense' ? ' active exp' : '');
  document.getElementById('btnInc').className = 'tt-btn' + (t === 'income' ? ' active inc' : '');
  rebuildCatSelect();
}

function rebuildCatSelect() {
  const cats = currentType === 'expense' ? CATS_EXP : CATS_INC;
  document.getElementById('txCat').innerHTML = cats.map(c => `<option value="${c}">${CAT_ICON[c]||'📁'} ${c}</option>`).join('');
}

function rebuildBudgetCatSelect() {
  document.getElementById('budgetCat').innerHTML = CATS_EXP.map(c => `<option value="${c}">${CAT_ICON[c]||'📁'} ${c}</option>`).join('');
}

window.addTx = async function() {
  const name = document.getElementById('txName').value.trim();
  const amt = parseFloat(document.getElementById('txAmt').value);
  const cat = document.getElementById('txCat').value;
  const date = document.getElementById('txDate').value;
  const note = document.getElementById('txNote').value.trim();
  
  if(!name || !amt || amt <= 0 || !date) { toast('請填寫名稱、金額及日期'); return; }
  
  txs.push({ id: Date.now(), type: currentType, name, amount: amt, cat, date, note });
  saveLocal();
  
  document.getElementById('txName').value = '';
  document.getElementById('txAmt').value = '';
  document.getElementById('txNote').value = '';
  toast('✅ 已記錄：' + name);
  renderAll();
  
  await pushToCloud();
}

window.delTx = async function(id) {
  if(!confirm('確定要刪除這筆紀錄嗎？')) return;
  txs = txs.filter(t => t.id !== id);
  saveLocal();
  renderAll();
  await pushToCloud();
}

window.saveBudget = async function() {
  const cat = document.getElementById('budgetCat').value;
  const amt = parseFloat(document.getElementById('budgetAmt').value);
  if(!cat || !amt || amt <= 0) { toast('請填寫分類和金額'); return; }
  budgets[cat] = amt;
  saveLocal();
  renderBudget();
  toast('✅ 預算已儲存');
  await pushToCloud();
}

function renderDashboard() {
  const list = monthTxs();
  const income = list.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const expense = list.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
  const bal = income - expense;
  
  document.getElementById('dIncome').textContent = fmt(income);
  document.getElementById('dExpense').textContent = fmt(expense);
  const bEl = document.getElementById('dBalance');
  bEl.textContent = (bal < 0 ? '-' : '') + fmt(bal);
  bEl.className = 'stat-value ' + (bal < 0 ? 'exp' : 'bal');

  const days = {};
  list.forEach(t => { const d = new Date(t.date).getDate(); if(!days[d]) days[d]={i:0,e:0}; days[d][t.type==='income'?'i':'e'] += t.amount; });
  const entries = Object.entries(days).sort((a,b) => +a[0] - +b[0]);
  const maxV = Math.max(...entries.map(([,v]) => Math.max(v.i, v.e)), 1);
  const bc = document.getElementById('barChart');
  
  if(!entries.length) {
    bc.innerHTML = '<div style="padding:1rem;color:var(--ink4);font-size:12px;font-family:\'Noto Serif TC\',serif;letter-spacing:1px">本月尚無收支圖表</div>';
  } else {
    bc.innerHTML = entries.map(([d,v]) => `<div class="bar-col"><div class="bar-track">${v.e?`<div class="bar e" style="height:${Math.round(v.e/maxV*64)}px"></div>`:''} ${v.i?`<div class="bar i" style="height:${Math.round(v.i/maxV*64)}px"></div>`:''}</div><div class="bar-d">${d}</div></div>`).join('');
  }

  const sorted = [...list].sort((a,b) => b.date.localeCompare(a.date));
  const txEl = document.getElementById('txList');
  if(!sorted.length) {
    txEl.innerHTML = '<div class="empty">📝<br>本月尚無記錄<br>點左側「新增記錄」開始記帳</div>';
    return;
  }

  const byDate = {};
  sorted.forEach(t => { if(!byDate[t.date]) byDate[t.date]=[]; byDate[t.date].push(t); });
  txEl.innerHTML = Object.entries(byDate).map(([date, items]) => `
    <div class="tx-date-group">
      <div class="tx-date-header">${date.replace(/-/g,' · ')}</div>
      ${items.map(t => `<div class="tx-item">
        <div class="tx-icon ${t.type}">${CAT_ICON[t.cat]||'📁'}</div>
        <div class="tx-info">
          <div class="tx-name">${t.name}</div>
          <div class="tx-meta">${t.note?t.note+' · ':''}<span class="tag">${t.cat}</span></div>
        </div>
        <div class="tx-amt ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
        <button class="tx-del" onclick="delTx(${t.id})">✕</button>
      </div>`).join('')}
    </div>`).join('');
}

function drawPie(canvasId, legendId, data) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 8;
  ctx.clearRect(0,0,W,H);
  const total = data.reduce((s,d) => s + d.v, 0);
  
  if(!total) {
    ctx.font = '13px "Noto Serif TC"'; ctx.fillStyle = 'var(--ink4)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('無資料', cx, cy);
    document.getElementById(legendId).innerHTML = ''; return;
  }
  
  let ang = -Math.PI/2;
  data.forEach((d, i) => {
    const slice = (d.v/total) * Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,ang,ang+slice); ctx.closePath();
    ctx.fillStyle = PIE_COLORS[i%PIE_COLORS.length]; ctx.fill();
    ang += slice;
  });
  ctx.beginPath(); ctx.arc(cx,cy,R*.55,0,Math.PI*2); ctx.fillStyle = 'var(--paper2)'; ctx.fill();
  
  document.getElementById(legendId).innerHTML = data.map((d, i) => `
    <div class="pie-leg-item">
      <div class="pie-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></div>
      <span class="pie-leg-name">${d.k}</span>
      <span class="pie-leg-pct">${Math.round(d.v/total*100)}%</span>
    </div>`).join('');
}

function renderChart() {
  const list = monthTxs();
  const expMap = {}, incMap = {};
  list.filter(t => t.type === 'expense').forEach(t => expMap[t.cat] = (expMap[t.cat]||0) + t.amount);
  list.filter(t => t.type === 'income').forEach(t => incMap[t.cat] = (incMap[t.cat]||0) + t.amount);
  const expData = Object.entries(expMap).sort((a,b) => b[1]-a[1]).map(([k,v]) => ({k,v}));
  const incData = Object.entries(incMap).sort((a,b) => b[1]-a[1]).map(([k,v]) => ({k,v}));
  drawPie('pieCanvas', 'pieLegend', expData);
  drawPie('pieIncCanvas', 'pieLegendInc', incData);
}

function renderBudget() {
  const list = monthTxs();
  const expMap = {};
  list.filter(t => t.type === 'expense').forEach(t => expMap[t.cat] = (expMap[t.cat]||0) + t.amount);
  const rows = CATS_EXP.map(cat => {
    const spent = expMap[cat] || 0;
    const budget = budgets[cat] || 0;
    const pct = budget ? Math.min(Math.round(spent/budget*100), 100) : 0;
    const color = pct > 90 ? 'var(--expense)' : pct > 70 ? 'var(--accent)' : 'var(--income)';
    return `<div class="budget-row">
      <div class="budget-cat">${CAT_ICON[cat]} ${cat}</div>
      <div class="progress-track"><div class="progress-bar" style="width:${budget?pct:0}%;background:${color}"></div></div>
      <div style="font-size:12px;color:var(--ink3);min-width:80px;text-align:right;font-family:'Quicksand',monospace;font-weight:600;">${fmt(spent)}${budget?' / '+fmt(budget):''}</div>
      <div class="budget-pct">${budget ? pct+'%' : '未設'}</div>
    </div>`;
  });
  document.getElementById('budgetGrid').innerHTML = rows.join('');
}

function renderAll() {
  updateMonthLabel();
  renderDashboard();
  renderChart();
  renderBudget();
}

// Init (系統啟動)
document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
rebuildCatSelect();
rebuildBudgetCatSelect();

// 第一時間立刻用本地資料渲染畫面
renderAll();

// 啟動 Firebase 雲端引擎
initFirebase();

</script>
