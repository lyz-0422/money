<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手帖・生活記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdfaf5;
            color: #4a3f35;
        }
        .serif { font-family: 'Noto Serif TC', serif; }
        .paper-texture {
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(74, 63, 53, 0.05), 0 8px 10px -6px rgba(74, 63, 53, 0.05);
        }
        .nav-active {
            color: #8b5e3c;
            background: #f5ede3;
            border-radius: 12px;
        }
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 自定義滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fdfaf5; }
        ::-webkit-scrollbar-thumb { background: #e5d5c5; border-radius: 10px; }
    </style>
</head>
<body class="paper-texture min-h-screen pb-20 md:pb-0">

    <div id="app" class="max-w-5xl mx-auto md:flex min-h-screen">
        
        <!-- Sidebar (Desktop) / Header (Mobile) -->
        <aside class="w-full md:w-64 bg-white/50 backdrop-blur-md border-r border-stone-200 p-6 flex flex-col sticky top-0 z-50 md:h-screen">
            <div class="flex items-center gap-3 mb-8">
                <div class="bg-stone-800 text-white p-2 rounded-xl">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <h1 class="serif text-xl font-bold tracking-wider">手帖記帳</h1>
            </div>

            <nav class="flex md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-2 md:pb-0">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-active flex items-center gap-3 px-4 py-3 text-stone-500 hover:bg-stone-100/50 rounded-xl transition-all whitespace-nowrap flex-1 md:flex-none">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    <span class="font-medium">本月概覽</span>
                </button>
                <button onclick="switchTab('add')" id="nav-add" class="flex items-center gap-3 px-4 py-3 text-stone-500 hover:bg-stone-100/50 rounded-xl transition-all whitespace-nowrap flex-1 md:flex-none">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i>
                    <span class="font-medium">新增記錄</span>
                </button>
                <button onclick="switchTab('analysis')" id="nav-analysis" class="flex items-center gap-3 px-4 py-3 text-stone-500 hover:bg-stone-100/50 rounded-xl transition-all whitespace-nowrap flex-1 md:flex-none">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i>
                    <span class="font-medium">收支分析</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-settings" class="flex items-center gap-3 px-4 py-3 text-stone-500 hover:bg-stone-100/50 rounded-xl transition-all whitespace-nowrap flex-1 md:flex-none">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="font-medium">同步設定</span>
                </button>
            </nav>

            <div class="mt-auto hidden md:block pt-6 border-t border-stone-100">
                <div class="flex items-center gap-2 mb-4">
                    <div id="sync-indicator" class="w-2 h-2 rounded-full bg-stone-300"></div>
                    <span id="sync-text" class="text-xs text-stone-400">連線中...</span>
                </div>
                <div class="bg-stone-100 rounded-lg p-3">
                    <p class="text-[10px] uppercase tracking-widest text-stone-400 mb-1 font-bold">當前月份</p>
                    <div class="flex items-center justify-between">
                        <button onclick="changeMonth(-1)" class="hover:text-brown-600"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <span id="display-date" class="serif text-sm">2023年 10月</span>
                        <button onclick="changeMonth(1)" class="hover:text-brown-600"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-10 relative">
            
            <!-- Dashboard Page -->
            <section id="page-dashboard" class="page-content space-y-6">
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <h2 class="serif text-3xl font-bold text-stone-800 mb-1" id="welcome-title">早安，生活</h2>
                        <p class="text-stone-400 text-sm">紀錄每一滴日常的點滴。</p>
                    </div>
                    <!-- Stats Card -->
                    <div class="grid grid-cols-3 gap-3 md:gap-6 bg-white p-4 rounded-2xl custom-shadow border border-stone-100">
                        <div class="text-center px-2">
                            <p class="text-[10px] text-stone-400 mb-1">本月收入</p>
                            <p id="stat-income" class="text-emerald-600 font-bold">+$0</p>
                        </div>
                        <div class="text-center px-2 border-x border-stone-100">
                            <p class="text-[10px] text-stone-400 mb-1">本月支出</p>
                            <p id="stat-expense" class="text-rose-500 font-bold">-$0</p>
                        </div>
                        <div class="text-center px-2">
                            <p class="text-[10px] text-stone-400 mb-1">剩餘預算</p>
                            <p id="stat-balance" class="text-stone-700 font-bold">$0</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Recent Transactions -->
                    <div class="md:col-span-2 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="serif text-lg font-bold">收支明細</h3>
                            <button onclick="switchTab('add')" class="text-xs text-stone-400 hover:text-stone-600 underline">查看全部</button>
                        </div>
                        <div id="tx-list" class="space-y-3">
                            <div class="bg-white/50 border-2 border-dashed border-stone-200 rounded-2xl p-10 text-center text-stone-400 italic">
                                尚未有任何記錄...
                            </div>
                        </div>
                    </div>

                    <!-- Category Insight (Mini) -->
                    <div class="space-y-4">
                        <h3 class="serif text-lg font-bold">支出佔比</h3>
                        <div class="bg-white p-5 rounded-3xl custom-shadow border border-stone-100">
                            <canvas id="miniPieChart" class="w-full aspect-square"></canvas>
                            <div id="mini-legend" class="mt-4 space-y-2">
                                <!-- Legend -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Add Entry Page -->
            <section id="page-add" class="page-content hidden max-w-xl mx-auto space-y-6">
                <div class="text-center space-y-2">
                    <h2 class="serif text-2xl font-bold">新增記帳</h2>
                    <p class="text-stone-400 text-sm">誠實紀錄，是理財的第一步。</p>
                </div>

                <div class="bg-white p-8 rounded-3xl custom-shadow border border-stone-100 space-y-6">
                    <!-- Type Selector -->
                    <div class="flex p-1 bg-stone-100 rounded-xl">
                        <button id="type-expense" onclick="setFormType('expense')" class="flex-1 py-2 rounded-lg text-sm font-bold bg-white text-stone-800 shadow-sm transition-all">支出</button>
                        <button id="type-income" onclick="setFormType('income')" class="flex-1 py-2 rounded-lg text-sm font-bold text-stone-400 transition-all">收入</button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-stone-400 mb-2 uppercase tracking-widest">金額 (TWD)</label>
                            <input type="number" id="input-amount" placeholder="0" class="w-full text-4xl serif font-bold text-stone-800 border-none focus:ring-0 p-0 placeholder:text-stone-200">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-stone-400 mb-2 uppercase tracking-widest">日期</label>
                                <input type="date" id="input-date" class="w-full bg-stone-50 border-none rounded-xl p-3 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-stone-400 mb-2 uppercase tracking-widest">分類</label>
                                <select id="input-category" class="w-full bg-stone-50 border-none rounded-xl p-3 text-sm">
                                    <!-- Options by JS -->
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-stone-400 mb-2 uppercase tracking-widest">說明</label>
                            <input type="text" id="input-note" placeholder="午餐、薪水、買衣服..." class="w-full bg-stone-50 border-none rounded-xl p-3 text-sm">
                        </div>
                    </div>

                    <button onclick="handleSave()" class="w-full bg-stone-800 text-white py-4 rounded-2xl font-bold hover:bg-stone-700 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        儲存此筆紀錄
                    </button>
                </div>
            </section>

            <!-- Analysis Page -->
            <section id="page-analysis" class="page-content hidden space-y-6">
                <h2 class="serif text-2xl font-bold">收支分析</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-3xl custom-shadow">
                        <h3 class="text-sm font-bold text-stone-400 mb-4">支出趨勢</h3>
                        <canvas id="trendChart"></canvas>
                    </div>
                    <div class="bg-white p-6 rounded-3xl custom-shadow">
                        <h3 class="text-sm font-bold text-stone-400 mb-4">支出結構</h3>
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Settings Page -->
            <section id="page-settings" class="page-content hidden space-y-6">
                <h2 class="serif text-2xl font-bold">同步設定</h2>
                <div class="bg-white p-8 rounded-3xl custom-shadow space-y-6 border border-stone-100">
                    <div>
                        <h3 class="font-bold text-stone-800 mb-2">雲端同步金鑰</h3>
                        <p class="text-sm text-stone-400 mb-4">使用此金鑰可在多個裝置（手機、平板）同步相同的記帳本資料。</p>
                        <div class="flex gap-2">
                            <input type="text" id="share-id-input" readonly class="flex-1 bg-stone-50 border border-stone-200 rounded-xl p-3 text-xs font-mono" placeholder="尚未產生金鑰">
                            <button onclick="copyShareUrl()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 rounded-xl text-stone-600 transition-all">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    <div class="pt-6 border-t border-stone-100">
                        <h3 class="font-bold text-stone-800 mb-2">建立新帳本</h3>
                        <p class="text-sm text-stone-400 mb-4">這會隨機產生一個全新的同步空間。</p>
                        <button onclick="createNewLedger()" class="w-full py-3 border-2 border-stone-800 text-stone-800 rounded-xl font-bold hover:bg-stone-800 hover:text-white transition-all">
                            產生新的共享金鑰
                        </button>
                    </div>
                    <div class="pt-6 border-t border-stone-100">
                        <h3 class="font-bold text-rose-500 mb-2">危險區域</h3>
                        <button onclick="clearLocalData()" class="text-sm text-stone-400 underline hover:text-rose-500">清除本地快取並登出</button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Message Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-stone-800 text-white px-6 py-3 rounded-full text-sm shadow-2xl opacity-0 translate-y-10 transition-all pointer-events-none z-[100]">
        訊息通知
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import Chart from 'https://cdn.jsdelivr.net/npm/chart.js/auto/auto.mjs';

        // 1. Firebase Config & Init
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ledger-app-v1';

        // 2. Global State
        let currentUserId = null;
        let ledgerId = new URLSearchParams(window.location.search).get('key') || localStorage.getItem('ledgerId');
        let records = [];
        let currentTab = 'dashboard';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let activeType = 'expense';
        let charts = {};

        const CATEGORIES = {
            expense: ['餐飲', '交通', '購物', '娛樂', '居住', '醫療', '教育', '其他'],
            income: ['薪資', '投資', '獎金', '副業', '其他']
        };

        const CAT_ICONS = {
            '餐飲': 'coffee', '交通': 'bus', '購物': 'shopping-bag', '娛樂': 'gamepad-2', 
            '居住': 'home', '醫療': 'heart-pulse', '教育': 'graduation-cap', '其他': 'more-horizontal',
            '薪資': 'briefcase', '投資': 'trending-up', '獎金': 'gift', '副業': 'laptop'
        };

        // 3. UI Functions (Attached to window for inline onclicks)
        window.switchTab = (tab) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            
            document.getElementById(`page-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('nav-active');
            
            currentTab = tab;
            renderAll();
            lucide.createIcons();
        };

        window.setFormType = (type) => {
            activeType = type;
            const expBtn = document.getElementById('type-expense');
            const incBtn = document.getElementById('type-income');
            
            if(type === 'expense') {
                expBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-stone-800 shadow-sm transition-all";
                incBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold text-stone-400 transition-all";
            } else {
                incBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white text-stone-800 shadow-sm transition-all";
                expBtn.className = "flex-1 py-2 rounded-lg text-sm font-bold text-stone-400 transition-all";
            }
            populateCategories();
        };

        const populateCategories = () => {
            const select = document.getElementById('input-category');
            if (!select) return;
            select.innerHTML = CATEGORIES[activeType].map(cat => `<option value="${cat}">${cat}</option>`).join('');
        };

        window.changeMonth = (delta) => {
            currentMonth += delta;
            if(currentMonth > 11) { currentMonth = 0; currentYear++; }
            if(currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderAll();
        };

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 3000);
        };

        window.copyShareUrl = () => {
            if(!ledgerId) return;
            const url = `${window.location.origin}${window.location.pathname}?key=${ledgerId}`;
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = url;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            showToast("連結已複製，分享即可同步！");
        };

        window.createNewLedger = () => {
            const newId = crypto.randomUUID();
            window.location.href = `${window.location.origin}${window.location.pathname}?key=${newId}`;
        };

        window.clearLocalData = () => {
            localStorage.clear();
            window.location.href = window.location.origin + window.location.pathname;
        };

        // 4. Data Processing & Charting
        const renderAll = () => {
            document.getElementById('display-date').textContent = `${currentYear}年 ${currentMonth + 1}月`;
            const dateInput = document.getElementById('input-date');
            if (dateInput && !dateInput.value) dateInput.valueAsDate = new Date();
            
            const filtered = records.filter(r => {
                const d = new Date(r.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            renderStats(filtered);
            renderList(filtered);
            renderCharts(filtered);
            
            const shareInput = document.getElementById('share-id-input');
            if(ledgerId && shareInput) {
                shareInput.value = ledgerId;
            }
        };

        const renderStats = (data) => {
            const income = data.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
            const expense = data.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
            document.getElementById('stat-income').textContent = `+$${income.toLocaleString()}`;
            document.getElementById('stat-expense').textContent = `-$${expense.toLocaleString()}`;
            document.getElementById('stat-balance').textContent = `$${(income - expense).toLocaleString()}`;
        };

        const renderList = (data) => {
            const container = document.getElementById('tx-list');
            if(data.length === 0) {
                container.innerHTML = `<div class="bg-white/50 border-2 border-dashed border-stone-200 rounded-2xl p-10 text-center text-stone-400 italic">本月尚未有記錄...</div>`;
                return;
            }

            container.innerHTML = data.slice(0, 15).map(r => `
                <div class="flex items-center justify-between p-4 bg-white rounded-2xl border border-stone-100 hover:border-stone-300 transition-all group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-stone-50 flex items-center justify-center text-stone-600">
                            <i data-lucide="${CAT_ICONS[r.category] || 'tag'}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="font-bold text-stone-800 line-clamp-1">${r.note || r.category}</p>
                            <p class="text-[10px] text-stone-400 uppercase tracking-tighter">${r.date} · ${r.category}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-right">
                            <p class="font-bold ${r.type === 'income' ? 'text-emerald-600' : 'text-stone-700'}">
                                ${r.type === 'income' ? '+' : '-'}$${r.amount.toLocaleString()}
                            </p>
                        </div>
                        <button onclick="delTx('${r.id}')" class="opacity-0 group-hover:opacity-100 p-2 text-rose-300 hover:text-rose-500 transition-all">
                             <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        window.delTx = async (id) => {
            if (!confirm('確定要刪除這筆紀錄嗎？')) return;
            const updated = records.filter(r => r.id !== id);
            try {
                const ledgerRef = doc(db, 'artifacts', appId, 'public', 'data', ledgerId);
                await setDoc(ledgerRef, { records: updated });
                showToast("記錄已刪除");
            } catch (e) {
                showToast("刪除失敗");
            }
        }

        const renderCharts = (data) => {
            const expData = data.filter(r => r.type === 'expense');
            const catMap = {};
            expData.forEach(r => catMap[r.category] = (catMap[r.category] || 0) + r.amount);

            const labels = Object.keys(catMap);
            const values = Object.values(catMap);
            const colors = ['#8b5e3c', '#d2b48c', '#a67b5b', '#e5d5c5', '#5c4033', '#c0c0c0', '#4a3f35', '#f5ede3'];

            // Mini Dashboard Chart
            const miniCanvas = document.getElementById('miniPieChart');
            if (miniCanvas) {
                if(charts.mini) charts.mini.destroy();
                const ctxMini = miniCanvas.getContext('2d');
                charts.mini = new Chart(ctxMini, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{ data: values, backgroundColor: colors, borderWeight: 0 }]
                    },
                    options: { plugins: { legend: { display: false } }, cutout: '70%', maintainAspectRatio: false }
                });

                const legendContainer = document.getElementById('mini-legend');
                legendContainer.innerHTML = labels.slice(0, 4).map((l, i) => `
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full" style="background:${colors[i]}"></div>
                            <span class="text-stone-500">${l}</span>
                        </div>
                        <span class="font-bold">$${catMap[l].toLocaleString()}</span>
                    </div>
                `).join('');
            }

            // Detailed Analysis Charts
            if(currentTab === 'analysis') {
                const catCanvas = document.getElementById('categoryChart');
                if (catCanvas) {
                    if(charts.cat) charts.cat.destroy();
                    charts.cat = new Chart(catCanvas, {
                        type: 'pie',
                        data: { labels, datasets: [{ data: values, backgroundColor: colors }] }
                    });
                }

                const trendCanvas = document.getElementById('trendChart');
                if (trendCanvas) {
                    const dayMap = {};
                    expData.forEach(r => {
                        const day = r.date.split('-')[2];
                        dayMap[day] = (dayMap[day] || 0) + r.amount;
                    });
                    const days = Object.keys(dayMap).sort();
                    if(charts.trend) charts.trend.destroy();
                    charts.trend = new Chart(trendCanvas, {
                        type: 'line',
                        data: {
                            labels: days,
                            datasets: [{ label: '每日支出', data: days.map(d => dayMap[d]), borderColor: '#8b5e3c', tension: 0.4 }]
                        }
                    });
                }
            }
        };

        // 5. Database Logic
        window.handleSave = async () => {
            const amount = parseFloat(document.getElementById('input-amount').value);
            const category = document.getElementById('input-category').value;
            const date = document.getElementById('input-date').value;
            const note = document.getElementById('input-note').value;

            if(!amount || amount <= 0 || !date) {
                showToast("請輸入正確的金額與日期");
                return;
            }

            if(!ledgerId) {
                ledgerId = crypto.randomUUID();
                localStorage.setItem('ledgerId', ledgerId);
                history.pushState(null, '', `?key=${ledgerId}`);
            }

            const newRecord = {
                id: crypto.randomUUID(),
                amount, category, date, note,
                type: activeType,
                createdAt: new Date().toISOString()
            };

            try {
                const ledgerRef = doc(db, 'artifacts', appId, 'public', 'data', ledgerId);
                const updatedRecords = [...records, newRecord];
                await setDoc(ledgerRef, { records: updatedRecords });
                
                showToast("記錄已儲存");
                document.getElementById('input-amount').value = '';
                document.getElementById('input-note').value = '';
                window.switchTab('dashboard');
            } catch (e) {
                console.error(e);
                showToast("連線錯誤，請檢查網路");
            }
        };

        // 6. Initialization
        const init = async () => {
            const welcomeMsg = ["早安，生活", "午安，辛苦了", "晚安，今天好嗎？"][Math.floor(new Date().getHours()/8)%3];
            const welcomeEl = document.getElementById('welcome-title');
            if (welcomeEl) welcomeEl.textContent = welcomeMsg;
            
            populateCategories();

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth failed:", e);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUserId = user.uid;
                    const indicator = document.getElementById('sync-indicator');
                    const text = document.getElementById('sync-text');
                    if (indicator) indicator.classList.add('bg-emerald-500');
                    if (text) text.textContent = "即時同步中";
                    
                    if(ledgerId) {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', ledgerId);
                        onSnapshot(docRef, (docSnap) => {
                            if(docSnap.exists()) {
                                records = docSnap.data().records || [];
                                renderAll();
                            }
                        }, (err) => {
                            console.error(err);
                            showToast("資料讀取失敗");
                        });
                    }
                }
            });

            lucide.createIcons();
            renderAll();
        };

        window.onload = init;

    </script>
</body>
</html>
