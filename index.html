<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族手帖・生活記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --paper: #fdfaf5;
            --ink: #4a3f35;
            --accent: #8b5e3c;
            --border: #e5d5c5;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            overflow-x: hidden;
        }
        .serif { font-family: 'Noto Serif TC', serif; }
        .paper-texture {
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(74, 63, 53, 0.05), 0 8px 10px -6px rgba(74, 63, 53, 0.05);
        }
        .nav-active {
            color: var(--accent);
            background: #f5ede3;
            border-radius: 14px;
            font-weight: 700;
        }
        .page-content {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input:focus, select:focus {
            outline: none;
            ring: 2px;
            ring-color: var(--accent);
        }
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 隱藏滾動條但保持可滾動 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="paper-texture min-h-screen">

    <div id="app" class="max-w-6xl mx-auto md:flex min-h-screen">
        
        <!-- Sidebar / Navigation -->
        <aside class="w-full md:w-64 bg-white/60 backdrop-blur-md border-r border-stone-200 p-6 flex flex-col sticky top-0 z-50 md:h-screen">
            <div class="flex items-center gap-3 mb-10">
                <div class="bg-stone-800 text-white p-2.5 rounded-2xl shadow-lg">
                    <i data-lucide="book-marked" class="w-6 h-6"></i>
                </div>
                <h1 class="serif text-xl font-bold tracking-wider">家族手帖</h1>
            </div>

            <!-- 移除了同步設定按鈕，讓介面更純粹 -->
            <nav class="flex md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-4 md:pb-0 scrollbar-hide">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-active flex items-center gap-3 px-5 py-3.5 text-stone-500 hover:bg-stone-100/50 rounded-2xl transition-all whitespace-nowrap flex-1 md:flex-none">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>本月概覽</span>
                </button>
                <button onclick="switchTab('add')" id="nav-add" class="flex items-center gap-3 px-5 py-3.5 text-stone-500 hover:bg-stone-100/50 rounded-2xl transition-all whitespace-nowrap flex-1 md:flex-none">
                    <i data-lucide="pen-tool" class="w-5 h-5"></i>
                    <span>新增記錄</span>
                </button>
                <button onclick="switchTab('analysis')" id="nav-analysis" class="flex items-center gap-3 px-5 py-3.5 text-stone-500 hover:bg-stone-100/50 rounded-2xl transition-all whitespace-nowrap flex-1 md:flex-none">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    <span>收支分析</span>
                </button>
            </nav>

            <div class="mt-auto hidden md:block pt-8 border-t border-stone-100">
                <div class="bg-stone-50 rounded-2xl p-4 border border-stone-100">
                    <p class="text-[10px] uppercase tracking-[0.2em] text-stone-400 mb-2 font-bold text-center">Calendar</p>
                    <div class="flex items-center justify-between">
                        <button onclick="changeMonth(-1)" class="p-1 hover:bg-white rounded-lg transition-colors"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <span id="display-date" class="serif text-sm font-bold">2024.10</span>
                        <button onclick="changeMonth(1)" class="p-1 hover:bg-white rounded-lg transition-colors"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-5 md:p-12 relative overflow-y-auto">
            
            <!-- 1. Dashboard -->
            <section id="page-dashboard" class="page-content space-y-8">
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                    <div>
                        <h2 class="serif text-4xl font-bold text-stone-800 mb-2" id="welcome-title">你好，生活</h2>
                        <p class="text-stone-400 text-sm">誠實面對每一分收支，就是對生活的溫柔。</p>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-4 md:gap-8 bg-white/80 backdrop-blur-sm p-6 rounded-[2rem] custom-shadow border border-white relative">
                        <!-- 長輩專用：一鍵更新按鈕 -->
                        <button onclick="manualSync()" class="absolute -top-3 -right-2 bg-stone-800 text-white text-[10px] px-3 py-1.5 rounded-full flex items-center gap-1 shadow-md hover:bg-stone-700 active:scale-95 transition-all z-10">
                            <i data-lucide="refresh-cw" class="w-3 h-3"></i> 更新資料
                        </button>
                        
                        <div class="text-center">
                            <p class="text-[10px] text-stone-400 mb-1 font-bold">INCOME</p>
                            <p id="stat-income" class="text-emerald-600 font-bold text-lg">+$0</p>
                        </div>
                        <div class="text-center border-x border-stone-100 px-4 md:px-8">
                            <p class="text-[10px] text-stone-400 mb-1 font-bold">EXPENSE</p>
                            <p id="stat-expense" class="text-rose-400 font-bold text-lg">-$0</p>
                        </div>
                        <div class="text-center">
                            <p class="text-[10px] text-stone-400 mb-1 font-bold">BALANCE</p>
                            <p id="stat-balance" class="text-stone-700 font-bold text-lg">$0</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Tx List -->
                    <div class="lg:col-span-2 space-y-5">
                        <div class="flex items-center justify-between px-2">
                            <h3 class="serif text-xl font-bold">收支明細</h3>
                            <span class="text-[10px] text-stone-400 font-bold uppercase tracking-widest">Recent items</span>
                        </div>
                        <div id="tx-list" class="space-y-3.5">
                            <div class="bg-white/40 border-2 border-dashed border-stone-200 rounded-3xl p-16 text-center text-stone-400 italic">
                                正在翻開手帳本...
                            </div>
                        </div>
                    </div>

                    <!-- Mini Insight -->
                    <div class="space-y-5">
                        <h3 class="serif text-xl font-bold px-2">支出分類</h3>
                        <div class="bg-white/90 p-8 rounded-[2.5rem] custom-shadow border border-white flex flex-col items-center">
                            <div class="w-full max-w-[180px] aspect-square relative">
                                <canvas id="miniPieChart"></canvas>
                            </div>
                            <div id="mini-legend" class="mt-8 w-full space-y-3">
                                <!-- Legend Items -->
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. Add Entry -->
            <section id="page-add" class="page-content hidden max-w-xl mx-auto space-y-8">
                <div class="text-center space-y-2">
                    <h2 class="serif text-3xl font-bold">新紀錄</h2>
                    <p class="text-stone-400 text-sm italic">每一筆紀錄都是生活的一部分。</p>
                </div>

                <div class="bg-white/95 p-10 rounded-[3rem] custom-shadow border border-white space-y-8">
                    <!-- Type Toggle -->
                    <div class="flex p-1.5 bg-stone-100 rounded-2xl">
                        <button id="type-expense" onclick="setFormType('expense')" class="flex-1 py-3 rounded-xl text-sm font-bold bg-white text-stone-800 shadow-sm transition-all">支出</button>
                        <button id="type-income" onclick="setFormType('income')" class="flex-1 py-3 rounded-xl text-sm font-bold text-stone-400 transition-all">收入</button>
                    </div>

                    <div class="space-y-6">
                        <div class="border-b border-stone-100 pb-2">
                            <label class="block text-[10px] font-bold text-stone-400 mb-1 uppercase tracking-widest">金額 (TWD)</label>
                            <input type="number" id="input-amount" placeholder="0" class="w-full text-5xl serif font-bold text-stone-800 border-none focus:ring-0 p-0 placeholder:text-stone-100 bg-transparent">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <label class="block text-[10px] font-bold text-stone-400 mb-2 uppercase tracking-widest">日期</label>
                                <input type="date" id="input-date" class="w-full bg-stone-50 border-none rounded-2xl p-4 text-sm font-medium">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-stone-400 mb-2 uppercase tracking-widest">分類</label>
                                <select id="input-category" class="w-full bg-stone-50 border-none rounded-2xl p-4 text-sm font-medium"></select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-stone-400 mb-2 uppercase tracking-widest">說明 (選填)</label>
                            <input type="text" id="input-note" placeholder="例如：美味的拉麵、買菜..." class="w-full bg-stone-50 border-none rounded-2xl p-4 text-sm font-medium">
                        </div>
                    </div>

                    <button onclick="handleSave()" class="w-full bg-stone-800 text-white py-5 rounded-[1.5rem] font-bold shadow-xl hover:bg-stone-700 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                        <i data-lucide="check" class="w-6 h-6"></i>
                        記錄下來
                    </button>
                </div>
            </section>

            <!-- 3. Analysis -->
            <section id="page-analysis" class="page-content hidden space-y-8">
                <h2 class="serif text-3xl font-bold">收支分析</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-[2.5rem] custom-shadow border border-white">
                        <h3 class="text-xs font-bold text-stone-400 mb-6 uppercase tracking-widest">支出趨勢 (日)</h3>
                        <canvas id="trendChart" height="250"></canvas>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] custom-shadow border border-white">
                        <h3 class="text-xs font-bold text-stone-400 mb-6 uppercase tracking-widest">支出結構</h3>
                        <canvas id="categoryChart" height="250"></canvas>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- 自動初始化提示框 (只有管理員第一次會看到) -->
    <div id="setup-overlay" class="fixed inset-0 bg-stone-900/80 backdrop-blur-sm z-[999] hidden flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full space-y-6 custom-shadow">
            <h3 class="serif text-2xl font-bold text-stone-800 flex items-center gap-2">
                <i data-lucide="party-popper" class="text-accent"></i> 空間建立成功！
            </h3>
            <p class="text-stone-600 text-sm leading-relaxed">
                這是系統為您家族自動產生的專屬資料庫 ID。<br><br>
                請點擊複製，並將它貼回原始碼中（約第 282 行）：<br>
                <code class="bg-stone-100 px-2 py-1 rounded text-rose-500 font-bold block mt-2">const FAMILY_ID = "貼在這裡";</code>
                <br>重新上傳到 GitHub 後，長輩們就可以無縫同步囉！
            </p>
            <input type="text" id="setup-id" readonly class="w-full bg-stone-50 border border-stone-200 rounded-xl p-4 font-mono text-center text-lg font-bold text-stone-800">
            <button onclick="copySetupId()" class="w-full bg-stone-800 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-stone-700 transition-all">複製 ID</button>
        </div>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-stone-800 text-white px-8 py-3.5 rounded-full text-sm shadow-2xl opacity-0 translate-y-10 transition-all pointer-events-none z-[100] tracking-wider">
        訊息通知
    </div>

    <script type="module">
        import Chart from 'https://cdn.jsdelivr.net/npm/chart.js/auto/auto.mjs';

        // ==========================================
        // 🔑 管理員設定區 (長輩不需要動這裡)
        // 第一次使用請保持空白 ""，系統會自動生成並告訴你貼什麼！
        // ==========================================
        const FAMILY_ID = ""; 
        

        // --- 1. 雲端通訊功能 (更換為最強防護、不易被阻擋的 KVDB 引擎) ---
        const KVDB_API = "https://kvdb.io";
        let records = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let currentTab = 'dashboard';
        let activeType = 'expense';
        let charts = {};

        const CATEGORIES = {
            expense: ['餐飲', '交通', '購物', '娛樂', '居住', '醫療', '教育', '其他'],
            income: ['薪資', '投資', '獎金', '副業', '其他']
        };

        const CAT_ICONS = {
            '餐飲': 'coffee', '交通': 'bus', '購物': 'shopping-bag', '娛樂': 'gamepad-2', 
            '居住': 'home', '醫療': 'heart-pulse', '教育': 'graduation-cap', '其他': 'more-horizontal',
            '薪資': 'briefcase', '投資': 'trending-up', '獎金': 'gift', '副業': 'laptop'
        };

        async function pushToCloud(data) {
            if (!FAMILY_ID) return;
            try {
                await fetch(`${KVDB_API}/${FAMILY_ID.trim()}/records`, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
            } catch (e) {
                console.error("同步儲存失敗", e);
                throw e; 
            }
        }

        async function pullFromCloud() {
            if (!FAMILY_ID) return null;
            try {
                // 加入時間戳參數，徹底打破瀏覽器的偷懶快取機制
                const res = await fetch(`${KVDB_API}/${FAMILY_ID.trim()}/records?_t=${new Date().getTime()}`, {
                    method: 'GET',
                    cache: 'no-store'
                });
                if (res.ok) {
                    const data = await res.json();
                    return data || [];
                }
            } catch (e) {
                console.error("雲端載入失敗", e);
            }
            return null;
        }

        // 自動為管理者建立資料庫的精靈
        async function autoSetupDB() {
            try {
                const res = await fetch(KVDB_API, { method: "POST" });
                if (res.ok) {
                    const newId = await res.text();
                    document.getElementById('setup-overlay').classList.remove('hidden');
                    document.getElementById('setup-id').value = newId;
                } else {
                    throw new Error("API 發生例外狀況");
                }
            } catch(e) {
                // 移除可怕的 alert 視窗，改用漂亮的介面告知被擋住了
                document.getElementById('setup-overlay').classList.remove('hidden');
                document.querySelector('#setup-overlay h3').innerHTML = '⚠️ 連線被阻擋了';
                document.querySelector('#setup-overlay p').innerHTML = '建立專屬空間失敗！<br><br>這通常是因為瀏覽器的<b>廣告阻擋外掛 (AdBlock)</b> 或<b>防毒軟體</b>攔截了連線。<br><br>👉 解決方法：<br>1. 暫時關閉廣告阻擋器。<br>2. 換一個瀏覽器（例如 Edge 或 Safari）。<br>3. 用手機分享 4G 網路再試一次！';
                document.getElementById('setup-id').style.display = 'none';
                document.querySelector('#setup-overlay button').style.display = 'none';
            }
        }

        window.copySetupId = () => {
            const input = document.getElementById('setup-id');
            input.select();
            document.execCommand('copy');
            alert("已複製！請去修改原始碼並重新上傳 GitHub。");
        };

        // --- 2. 核心功能綁定 ---
        
        window.switchTab = (tab) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            
            const page = document.getElementById(`page-${tab}`);
            const btn = document.getElementById(`nav-${tab}`);
            
            if (page) page.classList.remove('hidden');
            if (btn) btn.classList.add('nav-active');
            
            currentTab = tab;
            renderAll();
            if (window.lucide) window.lucide.createIcons();
        };

        window.setFormType = (type) => {
            activeType = type;
            const expBtn = document.getElementById('type-expense');
            const incBtn = document.getElementById('type-income');
            
            if(type === 'expense') {
                expBtn.className = "flex-1 py-3 rounded-xl text-sm font-bold bg-white text-stone-800 shadow-sm transition-all";
                incBtn.className = "flex-1 py-3 rounded-xl text-sm font-bold text-stone-400 transition-all";
            } else {
                incBtn.className = "flex-1 py-3 rounded-xl text-sm font-bold bg-white text-stone-800 shadow-sm transition-all";
                expBtn.className = "flex-1 py-3 rounded-xl text-sm font-bold text-stone-400 transition-all";
            }
            populateCategories();
        };

        window.changeMonth = (delta) => {
            currentMonth += delta;
            if(currentMonth > 11) { currentMonth = 0; currentYear++; }
            if(currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderAll();
        };

        // 長輩專用的一鍵同步按鈕
        window.manualSync = async () => {
            if (!FAMILY_ID) {
                showToast("尚未設定家族 ID，請聯絡管理員");
                return;
            }
            showToast("正在更新資料中...");
            const cloudData = await pullFromCloud();
            if (cloudData !== null) {
                records = cloudData;
                localStorage.setItem('family_ledger_backup', JSON.stringify(records)); // 備份到本地
                renderAll();
                showToast("資料已是最新狀態 ✨");
            } else {
                showToast("更新失敗，請檢查網路");
            }
        };

        window.handleSave = async () => {
            if (!FAMILY_ID) {
                showToast("請先完成初始化設定！");
                return;
            }

            const amountInput = document.getElementById('input-amount');
            const categoryInput = document.getElementById('input-category');
            const dateInput = document.getElementById('input-date');
            const noteInput = document.getElementById('input-note');
            
            const amount = parseFloat(amountInput.value);
            const category = categoryInput.value;
            const date = dateInput.value;
            const note = noteInput.value.trim();

            if(!amount || amount <= 0 || !date) {
                showToast("金額與日期不能為空喔");
                return;
            }

            const newRecord = {
                id: crypto.randomUUID(),
                amount, category, date, note,
                type: activeType,
                createdAt: new Date().toISOString()
            };

            // 雙重保險：先儲存到本地，就算網路突然斷線也看得到
            records.push(newRecord);
            localStorage.setItem('family_ledger_backup', JSON.stringify(records));
            
            renderAll(); // 先更新畫面
            showToast("同步中...");
            
            try {
                await pushToCloud(records);
                showToast("記錄成功！已自動同步 ✨");
            } catch (e) {
                showToast("網路異常，已暫存於本地");
            }

            amountInput.value = '';
            noteInput.value = '';
            window.switchTab('dashboard');
        };

        window.delTx = async (id) => {
            if (!confirm('要從手帳中擦除這筆紀錄嗎？')) return;
            records = records.filter(r => r.id !== id);
            
            localStorage.setItem('family_ledger_backup', JSON.stringify(records)); // 更新本地備份
            renderAll();

            try {
                await pushToCloud(records);
                showToast("記錄已刪除 ✨");
            } catch (e) {
                showToast("網路異常，請稍後再試");
            }
        };

        // --- 3. 渲染與介面邏輯 ---

        const populateCategories = () => {
            const select = document.getElementById('input-category');
            if (select) {
                select.innerHTML = CATEGORIES[activeType].map(cat => `<option value="${cat}">${cat}</option>`).join('');
            }
        };

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 3000);
        };

        const renderAll = () => {
            document.getElementById('display-date').textContent = `${currentYear}.${(currentMonth+1).toString().padStart(2,'0')}`;
            
            const dateInput = document.getElementById('input-date');
            if (dateInput && !dateInput.value) dateInput.valueAsDate = new Date();
            
            const filtered = records.filter(r => {
                const d = new Date(r.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            renderStats(filtered);
            renderList(filtered);
            renderCharts(filtered);
        };

        const renderStats = (data) => {
            const income = data.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
            const expense = data.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
            
            const iEl = document.getElementById('stat-income');
            const eEl = document.getElementById('stat-expense');
            const bEl = document.getElementById('stat-balance');
            
            if (iEl) iEl.textContent = `+$${income.toLocaleString()}`;
            if (eEl) eEl.textContent = `-$${expense.toLocaleString()}`;
            if (bEl) bEl.textContent = `$${(income - expense).toLocaleString()}`;
        };

        const renderList = (data) => {
            const container = document.getElementById('tx-list');
            if (!container) return;
            
            if(data.length === 0) {
                container.innerHTML = `<div class="bg-white/40 border-2 border-dashed border-stone-200 rounded-3xl p-16 text-center text-stone-400 italic">本月尚未有任何紀錄...</div>`;
                return;
            }

            container.innerHTML = data.slice(0, 15).map(r => `
                <div class="flex items-center justify-between p-5 bg-white/90 rounded-[1.5rem] border border-stone-100 hover:border-stone-300 transition-all group custom-shadow">
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 rounded-2xl bg-stone-50 flex items-center justify-center text-stone-600 shadow-inner">
                            <i data-lucide="${CAT_ICONS[r.category] || 'tag'}" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <p class="font-bold text-stone-800 line-clamp-1">${r.note || r.category}</p>
                            <p class="text-[10px] text-stone-400 font-bold uppercase tracking-widest mt-1">${r.date} · ${r.category}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-right">
                            <p class="font-bold ${r.type === 'income' ? 'text-emerald-600' : 'text-stone-700'}">
                                ${r.type === 'income' ? '+' : '-'}$${r.amount.toLocaleString()}
                            </p>
                        </div>
                        <button onclick="delTx('${r.id}')" class="opacity-0 group-hover:opacity-100 p-2 text-rose-300 hover:text-rose-500 transition-all active:scale-90">
                             <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            if (window.lucide) window.lucide.createIcons();
        };

        const renderCharts = (data) => {
            const expData = data.filter(r => r.type === 'expense');
            const catMap = {};
            expData.forEach(r => catMap[r.category] = (catMap[r.category] || 0) + r.amount);

            const labels = Object.keys(catMap);
            const values = Object.values(catMap);
            const colors = ['#8b5e3c', '#d2b48c', '#a67b5b', '#e5d5c5', '#5c4033', '#808080', '#4a3f35', '#f5ede3'];

            // Dashboard Chart
            const miniCanvas = document.getElementById('miniPieChart');
            if (miniCanvas) {
                if(charts.mini) charts.mini.destroy();
                charts.mini = new Chart(miniCanvas.getContext('2d'), {
                    type: 'doughnut',
                    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWeight: 0 }] },
                    options: { plugins: { legend: { display: false } }, cutout: '75%', maintainAspectRatio: false }
                });

                const legendEl = document.getElementById('mini-legend');
                if (legendEl) {
                    legendEl.innerHTML = labels.slice(0, 5).map((l, i) => `
                        <div class="flex items-center justify-between text-[11px] font-medium">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full" style="background:${colors[i]}"></div>
                                <span class="text-stone-500">${l}</span>
                            </div>
                            <span class="font-bold">$${catMap[l].toLocaleString()}</span>
                        </div>
                    `).join('');
                }
            }

            // Analysis Page Charts
            if(currentTab === 'analysis') {
                const c1 = document.getElementById('categoryChart');
                if (c1) {
                    if(charts.cat) charts.cat.destroy();
                    charts.cat = new Chart(c1.getContext('2d'), {
                        type: 'pie',
                        data: { labels, datasets: [{ data: values, backgroundColor: colors }] }
                    });
                }

                const c2 = document.getElementById('trendChart');
                if (c2) {
                    const dayMap = {};
                    expData.forEach(r => { const d = r.date.split('-')[2]; dayMap[d] = (dayMap[d]||0) + r.amount; });
                    const sortedDays = Object.keys(dayMap).sort();
                    if(charts.trend) charts.trend.destroy();
                    charts.trend = new Chart(c2.getContext('2d'), {
                        type: 'line',
                        data: {
                            labels: sortedDays,
                            datasets: [{ label: 'Daily Expense', data: sortedDays.map(d => dayMap[d]), borderColor: '#8b5e3c', backgroundColor: '#f5ede366', fill: true, tension: 0.4 }]
                        },
                        options: { scales: { y: { beginAtZero: true } } }
                    });
                }
            }
        };

        // --- 4. 啟動與初始化 ---

        const init = async () => {
            const h = new Date().getHours();
            const welcomeMsg = h < 12 ? "早安，今天好嗎？" : h < 18 ? "午安，生活努力中" : "晚安，紀錄日常吧";
            const wEl = document.getElementById('welcome-title');
            if (wEl) wEl.textContent = welcomeMsg;
            
            populateCategories();
            if (window.lucide) window.lucide.createIcons();

            // 如果尚未貼上 ID，執行自動配置精靈
            if (!FAMILY_ID || FAMILY_ID.trim() === "") {
                await autoSetupDB();
                return; // 等待使用者填上 ID
            }

            // 直接讀取固定的雲端資料庫
            showToast("正在開啟家族手帳...");
            const cloudData = await pullFromCloud();
            if (cloudData !== null) {
                records = cloudData;
                localStorage.setItem('family_ledger_backup', JSON.stringify(records)); // 同步備份到本地
                renderAll();
            } else {
                // 如果抓取失敗，優先顯示本地備份資料，避免顯示空白
                const backup = localStorage.getItem('family_ledger_backup');
                if (backup) {
                    records = JSON.parse(backup);
                    showToast("網路異常，顯示本地備份資料");
                    renderAll();
                } else {
                    showToast("載入失敗，請檢查網路連線");
                }
            }
        };

        window.onload = init;

    </script>
</body>
</html>
